<div class="container">
  <h2>Recipe List</h2>
  @for(recipe of recipeArray; track recipe.id){
    <div class="recipe-card-wrapper">
      <div class="recipe-card">
        <h2>{{recipe.name}}</h2>
        <p>{{recipe.description}}</p>
        <p>{{recipe.country}}</p>
        <p class="recipe-menu">
          On Menu: {{recipe.onMenu ? "Yes" : "No"}}
        </p>
        <p class="recipe-rating">{{recipe.rating}}</p>
        @if(recipe.rating >= 7){
          <span class="high-rating">High Rating</span>
        }
        <!-- Creating a button to click on to change the onMenu to false or true -->
        <button (click)="toggleFoodMenu(recipe)">Toggle Menu</button>
      </div>
    </div>
  }@empty{
    <div class="no-courses">There are no courses available</div>
  }
</div>
